name: Release Build

on:
  push:
    tags:
      - 'v*'
      - 'pre-*'
  # 允许在 Actions 页面手动重跑一次发布构建（例如某个平台产物需要重建时）
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BUILD_TIME=$(date "+%F_%T")
          GIT_COMMIT=$(git rev-parse HEAD)
          VERSION=${GITHUB_REF#refs/tags/}
          
          OUTPUT="ipaas-agent-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUTPUT="${OUTPUT}.exe"
          fi

          echo "Building ${OUTPUT} for ${{ matrix.goos }} ${{ matrix.goarch }}"
          echo "Version: ${VERSION}"
          echo "Build Time: ${BUILD_TIME}"
          echo "Git Commit: ${GIT_COMMIT}"
          
          go build -ldflags "-X main.BuildTime=${BUILD_TIME} -X main.GitCommit=${GIT_COMMIT} -X main.Version=${VERSION}" -o ${OUTPUT}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          # 同一 run 内 artifact 名称必须唯一，matrix 下必须带上 goos/goarch
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ipaas-agent-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          # 平铺到同一目录，避免每个 artifact 一个子目录导致下面的 glob 匹配不到
          merge-multiple: true
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/ipaas-agent-*
          prerelease: ${{ contains(github.ref, 'pre-') }}
          body_path: ./release_notes.md
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
